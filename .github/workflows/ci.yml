name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir-version: ["1.20.0-otp-29"]
        otp-version: ["29.0.1"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Cache Elixir dependencies
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/typst_nif

      # wasm-bindgen-cli must be the version of the crate in the lock.
      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' native/typst_nif/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Build the WASM editing module
        run: MIX_ENV=test mix ash_typst.wasm.build

      - name: Run tests
        run: mix test

      - name: Run Credo
        run: mix credo --strict
